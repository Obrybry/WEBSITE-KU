<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBRY | My Spotify</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 16px;
    background: #090909 url("https://raw.githubusercontent.com/Obrybry/WEBSITE-KU/main/1808b7b8f232d39ae2dfdd717cb1ccd6.jpg") center / cover fixed no-repeat;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    margin: 20px 0 28px;
}

.logo {
    width: 55px;
    height: 55px;
    fill: #1DB954;
}

h1 {
    margin: 10px 0;
    font-size: 32px;
    letter-spacing: 3px;
}

header p {
    color: #ddd;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 18px;
    background: rgba(10,10,10,.82);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;
}

h2 {
    font-size: 20px;
    margin-top: 5px;
}

.slide-hint {
    color: #1DB954;
    font-size: 13px;
    margin-bottom: 16px;
}

/* CAROUSEL KIRI-KANAN */
.playlist-container {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 14px;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 14px;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #1DB954 #252525;
}

.playlist {
    flex: 0 0 85%;
    min-width: 0;
    scroll-snap-align: start;
}

.playlist iframe {
    display: block;
    width: 100%;
    height: 352px;
    border: 0;
    border-radius: 12px;
}

.playlist-container::-webkit-scrollbar {
    height: 5px;
}

.playlist-container::-webkit-scrollbar-thumb {
    background: #1DB954;
    border-radius: 10px;
}

footer {
    text-align: center;
    color: #ddd;
    font-size: 13px;
    margin: 25px 0 10px;
}

@media (min-width: 700px) {
    .playlist {
        flex-basis: calc(50% - 7px);
    }
}

@media (max-width: 600px) {
    body {
        padding: 12px;
        background-attachment: scroll;
    }

    main {
        padding: 14px;
    }

    h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<header>
    <svg class="logo" viewBox="0 0 24 24" aria-label="Spotify">
        <path d="M12 0C5.372 0 0 5.372 0 12s5.372 12 12 12 12-5.372 12-12S18.628 0 12 0zm5.503 17.308a.75.75 0 0 1-1.032.248c-2.826-1.727-6.385-2.117-10.578-1.16a.75.75 0 1 1-.334-1.462c4.586-1.048 8.52-.598 11.696 1.342a.75.75 0 0 1 .248 1.032zm1.472-3.275a.937.937 0 0 1-1.289.309c-3.235-1.989-8.168-2.565-11.994-1.403a.938.938 0 1 1-.545-1.795c4.372-1.326 9.802-.684 13.519 1.6a.937.937 0 0 1 .309 1.289zm.126-3.41C15.22 8.33 8.79 8.117 5.068 9.247a1.125 1.125 0 1 1-.654-2.153c4.273-1.297 11.38-1.047 15.875 1.622a1.125 1.125 0 0 1-1.188 1.907z"/>
    </svg>

    <h1>OBRY</h1>
    <p>My Music • My Playlist • My Vibes</p>
</header>

<main>
    <h2>🎧 My Playlist</h2>
    <p class="slide-hint">← Geser ke kiri untuk playlist berikutnya →</p>

    <div class="playlist-container">

        <div class="playlist">
            <iframe
                src="https://open.spotify.com/embed/playlist/0HCgtcdgiD1j8Zrgsml4rX"
                title="Playlist 1"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>
        </div>

        <div class="playlist">
            <iframe
                src="https://open.spotify.com/embed/playlist/3ek65NRqWq1WYjGUvCUUi7"
                title="Playlist 2"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>
        </div>

        <div class="playlist">
            <iframe
                src="https://open.spotify.com/embed/playlist/37i9dQZF1DX186v583rmzp"
                title="Playlist 3"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>
        </div>

    </div>
</main>

<footer>
    © 2026 OBRY • All rights reserved.
</footer>

</body>
</html>
